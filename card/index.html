<body class="page-card">
  <!-- Include -->
  <header class="site-header">

  <a href="https://zoldof.com">📖メニュー</a>

</header>

  <div id="content">
    <!-- Liquid -->
    <div class="page-cards">
  <div class="page-cards__grid">
    
      <div class="page-cards__card">
        <a class="page-cards__link" href="/items/item1/">
          <img class="page-cards__img" src="/assets/img/item1.jpg" alt="Item 1" loading="lazy" />
          <div class="page-cards__body">
            <h3 class="page-cards__title">Item 1</h3>
            <p class="page-cards__desc">説明文（短め推奨）</p>
          </div>
        </a>
      </div>
    
      <div class="page-cards__card">
        <a class="page-cards__link" href="/items/item2/">

      <div class="page-cards__card">
        <a class="page-cards__link" href="/items/item3/">
          <img class="page-cards__img" src="/assets/img/item3.jpg" alt="Item 3" loading="lazy" />
          <div class="page-cards__body">
            <h3 class="page-cards__title">Item 3</h3>
            <p class="page-cards__desc">説明文（短め推奨）</p>
          </div>
        </a>
      </div>
    
  </div>
</div>

<style>
  .page-cards .page-cards__grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    align-items: stretch;
  }
  .page-cards .page-cards__card{
    border:1px solid #e5e5e5;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
    height:100%;
  }
  .page-cards .page-cards__link{
    display:block;
    color:inherit;
    text-decoration:none;
    height:100%;
  }
  .page-cards .page-cards__img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
  }
  .page-cards .page-cards__body{ padding:12px; }
  .page-cards .page-cards__title{
    margin:0 0 8px 0;
    font-size:1rem;
  }
  .page-cards .page-cards__desc{
    margin:0;
    color:#444;
    font-size:.95rem;
    line-height:1.5;
  }
</style>


  </div>
  <script type="module">
    import { renderKatex } from "https://cdn.jsdelivr.net/gh/zoldof/algo-notes-ci@main/docs/katex.js";
    import { addBackToTopLinks } from "https://cdn.jsdelivr.net/gh/zoldof/algo-notes-ci@main/docs/backtop.js";
    import { initListener, load } from "https://cdn.jsdelivr.net/gh/zoldof/algo-notes-ci@main/docs/bookmark.js";
    document.addEventListener("DOMContentLoaded", async () => {
      renderKatex(document.getElementById("content"));
      addBackToTopLinks();
      if (document.body.classList.contains('page-card')) {
        initListener();
        load();
      }
    });
  </script>
